publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  easy_localization: ^3.0.7
  easy_logger: ^0.0.2
  equatable: ^2.0.7
  json_annotation: ^4.11.0

dev_dependencies:
